<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
<title id="title">梵虚 FANXU — 把好奇心，写成作品。</title><desc id="desc">独立应用、AI 工作流、学习与工具。四张卡片连接四个真实项目。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111f31"/><stop offset="1" stop-color="#090f1b"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#237567" stop-opacity=".27"/><stop offset="1" stop-color="#237567" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#9fc1cc" opacity=".14"/></pattern></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="1000" height="350" rx="16" fill="url(#bg)" stroke="none"/><rect x="0" y="0" width="1000" height="350" rx="16" fill="url(#dots)" stroke="none"/><ellipse cx="780" cy="170" rx="280" ry="230" fill="url(#glow)"/><text x="46" y="48" font-size="21" fill="#e8eef4" font-weight="600" letter-spacing="0">梵虚</text><text x="104" y="48" font-size="13" fill="#9db3c7" font-weight="400" letter-spacing="2.5">/ FANXU</text><text x="46" y="125" font-size="49" fill="#f2f5ef" font-weight="700" letter-spacing="1">把好奇心，</text><text x="46" y="191" font-size="57" fill="#91ead6" font-weight="700" letter-spacing="1">写成作品。</text><path d="M50 209Q183 218 324 205" stroke="#91ead6" stroke-width="2" fill="none" opacity=".55"/><text x="49" y="249" font-size="18" fill="#c0cfdd" font-weight="400" letter-spacing="0">从一个想法，到一件可以使用的作品。</text><text x="49" y="302" font-size="12" fill="#91a8bc" font-weight="400" letter-spacing="2">IMAGINE. DESIGN. BUILD. SHIP.</text><path d="M551 173H590M590 109V239M590 109H621M590 239H621" stroke="#365c68" fill="none" stroke-width="1.4"/><circle cx="551" cy="173" r="5" fill="#90ead6"/><g transform="translate(620 48)"><rect x="0" y="0" width="154" height="120" rx="13" fill="#2b231f" stroke="#806044"/><circle cx="21" cy="25" r="3" fill="#ff985c"/><text x="32" y="29" font-size="10" fill="#ff985c" font-weight="500" letter-spacing="0.4">01 / APPS</text><text x="19" y="71" font-size="23" fill="#f1f3ee" font-weight="650" letter-spacing="0">AppShow</text><text x="20" y="98" font-size="12" fill="#b8c0c5" font-weight="400" letter-spacing="0">把热爱做成应用</text></g><g transform="translate(790 48)"><rect x="0" y="0" width="164" height="120" rx="13" fill="#142d31" stroke="#37625e"/><circle cx="21" cy="25" r="3" fill="#89e6cc"/><text x="32" y="29" font-size="10" fill="#89e6cc" font-weight="500" letter-spacing="0.4">02 / WORKFLOWS</text><text x="19" y="71" font-size="23" fill="#f1f3ee" font-weight="650" letter-spacing="0">SkillDock</text><text x="20" y="98" font-size="12" fill="#b8c0c5" font-weight="400" letter-spacing="0">让能力连接起来</text></g><g transform="translate(620 184)"><rect x="0" y="0" width="154" height="120" rx="13" fill="#242338" stroke="#4b4767"/><circle cx="21" cy="25" r="3" fill="#bba9ef"/><text x="32" y="29" font-size="10" fill="#bba9ef" font-weight="500" letter-spacing="0.4">03 / LEARNING</text><text x="19" y="71" font-size="19" fill="#f1f3ee" font-weight="650" letter-spacing="0">渐进式编程课</text><text x="20" y="98" font-size="12" fill="#b8c0c5" font-weight="400" letter-spacing="0">让学习持续发生</text></g><g transform="translate(790 184)"><rect x="0" y="0" width="164" height="120" rx="13" fill="#182a3e" stroke="#3f5a73"/><circle cx="21" cy="25" r="3" fill="#9ccff3"/><text x="32" y="29" font-size="10" fill="#9ccff3" font-weight="500" letter-spacing="0.4">04 / TOOLS</text><text x="19" y="71" font-size="23" fill="#f1f3ee" font-weight="650" letter-spacing="0">饕影热点</text><text x="20" y="98" font-size="12" fill="#b8c0c5" font-weight="400" letter-spacing="0">让信息更好抵达</text></g></g></svg>
